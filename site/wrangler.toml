# Cloudflare Worker: the whole public bioc-on-ice site (#191), copied from
# omicidx site/.
#   bioconice.cancerdatasci.org/        -> pages (Quarto web/_site/, Workers static assets)
#   bioconice.cancerdatasci.org/data/*  -> `data-bioconice` R2 bucket
#   data.bioconice.cancerdatasci.org/*  -> same bucket at `/` (release bundle
#                                          views hard-code this URL; never redirect)
# The bucket path is the anonymous, credential-free read surface for the
# frozen releases: range requests + CORS for DuckDB `ATTACH` and read_parquet.
#
# Deploy (needs `wrangler login` and the bucket). Render the pages first:
#   cd site && quarto render web && npm ci && npx wrangler deploy
# custom_domain auto-creates the DNS records on deploy (cancerdatasci.org is
# Cloudflare-managed).

name = "data-bioconice"
main = "src/index.ts"
compatibility_date = "2025-03-14"

[assets]
directory = "./web/_site"
binding = "ASSETS"
not_found_handling = "404-page"
# The worker routes first: on the data host every path is a bucket key, even
# ones that collide with a page (e.g. `/`).
run_worker_first = true

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "data-bioconice"
remote = true  # `wrangler dev` reads the real bucket

[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "data_bioconice_usage"

[[routes]]
pattern = "bioconice.cancerdatasci.org"
custom_domain = true

[[routes]]
pattern = "data.bioconice.cancerdatasci.org"
custom_domain = true
