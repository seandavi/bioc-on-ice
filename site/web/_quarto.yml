# The public bioc-on-ice site (#215), ported from omicidx docs/. Served by the
# Worker in ../ (wrangler.toml `[assets]`); see ../README.md.
project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "guides/*.qmd"
    - "sources/*.qmd"
    - "explorer/*.qmd"
  resources:
    - shell-links.js
    - sources/source-facts.js
    - sources/sources.json

website:
  title: "bioc-on-ice"
  site-url: "https://bioconice.cancerdatasci.org"
  description: "Bioconductor annotation without the packages: dated releases of Parquet tables plus a DuckDB database, queryable over anonymous HTTPS."
  favicon: favicon.svg
  # The one GA4 property shared by every site.
  google-analytics: "G-KLLV1GCF4E"
  repo-url: https://github.com/seandavi/bioc-on-ice
  repo-subdir: site/web
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  navbar:
    left:
      - href: releases.qmd
        text: Releases
      - href: explorer/index.qmd
        text: Explorer
      - href: guides/versions-and-citation.qmd
        text: Versions and citation
    right:
      - icon: github
        href: https://github.com/seandavi/bioc-on-ice
        aria-label: GitHub repository
  sidebar:
    style: docked
    contents:
      - section: Overview
        contents:
          - href: index.qmd
            text: Home
          - href: guides/versions-and-citation.qmd
            text: Versions and citation
          - href: guides/mcp.qmd
            text: Ask an assistant (MCP)
      - section: Sources
        href: sources/index.qmd
        contents:
          - href: sources/bedbase.qmd
            text: BEDbase
          - href: sources/biogrid.qmd
            text: BioGRID
          - href: sources/bugsigdb.qmd
            text: BugSigDB
          - href: sources/cellosaurus.qmd
            text: Cellosaurus
          - href: sources/cellxgene.qmd
            text: CELLxGENE
          - href: sources/complexportal.qmd
            text: Complex Portal
          - href: sources/encode.qmd
            text: ENCODE
          - href: sources/ensembl.qmd
            text: Ensembl
          - href: sources/eqtlcatalogue.qmd
            text: eQTL Catalogue
          - href: sources/gwas_catalog.qmd
            text: GWAS Catalog
          - href: sources/hgnc.qmd
            text: HGNC
          - href: sources/icite.qmd
            text: iCite
          - href: sources/intact.qmd
            text: IntAct
          - href: sources/mane.qmd
            text: MANE
          - href: sources/ncbi_gene.qmd
            text: NCBI Gene
          - href: sources/obo.qmd
            text: Ontologies (OBO)
          - href: sources/pubmed.qmd
            text: PubMed
          - href: sources/pubtator3.qmd
            text: PubTator3
          - href: sources/rnacentral.qmd
            text: RNAcentral
          - href: sources/uniprot.qmd
            text: UniProt
          - href: sources/wikipathways.qmd
            text: WikiPathways
      - section: In the browser
        contents:
          - href: explorer/index.qmd
            text: Explorer
          - href: releases.qmd
            text: Releases

format:
  html:
    # bioc-infrastructure's archify theme on cosmo, in indigo/violet so the
    # site doesn't read as omicidx (theme/*.scss).
    theme:
      light: [cosmo, theme/archify.scss, theme/bioconice-light.scss]
      dark: [cosmo, theme/archify.scss, theme/bioconice-dark.scss]
    respect-user-color-scheme: true
    # Quarto's WCAG-AA highlight style; switches to a11y-dark in dark mode.
    highlight-style: a11y
    grid:
      sidebar-width: 250px
      body-width: 880px
      margin-width: 220px
    toc: true
    code-copy: true
    # "Open in DuckDB Shell" under every SQL example.
    include-after-body: shell-links.html
