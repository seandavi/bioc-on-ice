<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>biocOnIce Explorer</title>
<meta name="description" content="Browse the biocOnIce catalog: namespaces, tables, column docs, provenance and copyable queries, read from the public biocOnIce release.">
<link rel="stylesheet" href="style.css">
<!--
  The Query tab (DuckDB-WASM) needs this: its browser build imports the bare
  specifier "apache-arrow", which only resolves via an import map, and an
  import map must be present before any module script runs — so it is
  declared here even though DuckDB-WASM itself loads only on first Run.
-->
<script type="importmap">
{ "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm" } }
</script>
</head>
<body>
<header>
  <h1>biocOnIce Explorer</h1>
  <span class="sub">reading <code id="catalog-endpoint"></code>, anonymously</span>
  <nav aria-label="Views">
    <button id="nav-browse" aria-current="page">Browse</button>
    <button id="nav-recipes">Recipes</button>
  </nav>
</header>

<div class="layout">
  <nav id="catalog" aria-label="Namespaces and tables">
    <h2>Namespaces</h2>
    <div id="catalog-tree" aria-busy="true">
      <p class="status">Loading namespaces…</p>
    </div>
  </nav>

  <main id="main">
    <section id="view-browse">
      <div id="table-view">
        <p class="status">Select a table from the left to see its columns, a copyable query and a query box.</p>
      </div>
    </section>
    <section id="view-recipes" hidden></section>
  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
