# icegate configuration for the biocOnIce catalog.
#
# Deployed as its own icegate instance, separate from the omicidx gateway, so
# that an anonymous-enabled config never shares a file — or a blast radius —
# with a key-only one.
#
# ${VARS} resolve from Workers secrets at deploy time; no infrastructure
# identifiers are committed here. R2_CATALOG_PREFIX is the Data Catalog UUID
# that /v1/config returns as `overrides.prefix` — for R2 this is NOT the
# account id.

cors:
  enabled: true
  origins:
    - "*" # DuckDB-WASM in the browser; R2 serves no CORS headers of its own

authentication:
  # Still false, but the reason changed (ADR-0010/0011 in this repo): the
  # IP-bearing logs left for GCS in #31, and the backend now uses a
  # bucket-scoped read-only vending token, verified 2026-08-07 to contain
  # vended credentials to the bioconice bucket, read-only. Flip to true once
  # the post-deploy gateway verification in icegate#34 passes.
  anonymous:
    enabled: false

  api_keys:
    enabled: true

    # Ingest key. The only principal that may write.
    seandavi:
      sha256: c3cc27c7f822a41fb7c6f05eb00b4d48ffa1c85c775f0ad9a120499c25ee907d
      namespaces:
        - provenance
        - raw
        - reference
        - annotation
        - ontology
        - clinical
      permissions:
        - read
        - write

    # Personal read-only key (plaintext: Secret Manager
    # bioconice-icegate-key-seandavi-ro, cdsci-infra). Exercises the RO token
    # path end to end — same path anonymous will use.
    seandavi-ro:
      sha256: 7b12156e9a414f28369067c27b0b10107baae6ffc2ce7c03181eb2da488a855e
      namespaces:
        - provenance
        - raw
        - reference
        - annotation
        - ontology
        - clinical
      permissions:
        - read

    # Shared evaluation key for the Bioconductor team, read-only. Separate from
    # the ingest key on purpose: a key handed to several people must not be able
    # to write, and it has to be revocable without breaking ingest. Rotate by
    # replacing this digest — the plaintext is not recoverable from it.
    bioconductor:
      sha256: 41fb922a6ea918a1db39312bf0b93b4153aa65467cc7e824be0957b6e30b4ddf
      namespaces:
        - provenance
        - raw
        - reference
        - annotation
      permissions:
        - read

catalogs:
  bioconice:
    endpoint: https://catalog.cloudflarestorage.com/${CF_ACCOUNT_ID}/bioconice
    backend_warehouse: ${CF_ACCOUNT_ID}_bioconice
    backend_prefix: ${R2_CATALOG_PREFIX}
    # Two backend tokens (icegate#34): the read-only, bucket-scoped vending
    # token is the default every request falls back to; the write token is
    # selected only for principals granted `write`. CF_API_TOKEN is still the
    # legacy Admin token — replace with a bucket-scoped RW vending token when
    # minted (then nothing Admin-level remains in this Worker).
    auth:
      bearer_token: ${CF_API_TOKEN_RO}
      bearer_token_write: ${CF_API_TOKEN}
    capabilities:
      read: true
      write: true
