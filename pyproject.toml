[project]
name = "bioconice"
version = "0.1.0"
description = "Bioconductor annotation as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
]

[project.scripts]
bioconice = "bioconice.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioconice"]
