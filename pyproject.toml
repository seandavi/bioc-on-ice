[project]
name = "bioconice"
version = "0.1.0"
description = "Bioconductor annotation as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    # official MCP SDK (FastMCP): src/bioconice/mcp.py (issue #100) needs a stdio server
    # and tool/resource decorators that a hand-rolled JSON-RPC loop would just reimplement.
    "mcp>=1.2,<2",
    # ADR-0012/0015: the release reads cdsci-lake (cdsci.lake.connect); the gate's table
    # contracts are cdsci.lake.contracts; R2 and HF credentials come from GSM through
    # cdsci.lake.config / .secrets.
    "cdsci-lake",
    # publish.py, upload.py, hf.py, gate.py: the bundle, upload, Hugging Face push and gate
    # mechanics are cdsci-lake ADR-0027's shared package (pyarrow and huggingface-hub come
    # with the extras); this repo keeps the table list, docs, contracts and release policy.
    "cdsci-publish[upload,hf]",
]

[tool.uv.sources]
cdsci-lake = { git = "https://github.com/seandavi/cdsci-lake", rev = "c9fccf4c16db2df127cdb111919a117e1d1f5c6f" }
cdsci-publish = { git = "https://github.com/seandavi/cdsci-lake", rev = "c9fccf4c16db2df127cdb111919a117e1d1f5c6f", subdirectory = "packages/cdsci-publish" }

[project.scripts]
bioconice = "bioconice.__main__:main"
bioconice-mcp = "bioconice.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: hits the live release or icegate over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioconice"]
