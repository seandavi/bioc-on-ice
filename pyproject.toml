[project]
name = "bioconice"
version = "0.1.0"
description = "Bioconductor annotation as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    # official MCP SDK (FastMCP): src/bioconice/mcp.py (issue #100) needs a stdio server
    # and tool/resource decorators that a hand-rolled JSON-RPC loop would just reimplement.
    "mcp>=1.2,<2",
]

[project.scripts]
bioconice = "bioconice.__main__:main"
bioconice-mcp = "bioconice.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]
# ADR-0012: the BugSigDB lake read path imports cdsci-lake lazily and its tests
# importorskip it. Not a dependency here until cdsci-lake publishes: a path source
# would break `uv sync` on any checkout without the sibling (CI). Dev-only, after
# `uv sync`: `uv pip install -e ../cdsci-lake` (README).

[tool.pytest.ini_options]
markers = ["slow: hits the live icegate endpoint over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioconice"]
