[project]
name = "bioconice"
version = "0.1.0"
description = "Bioconductor annotation as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    # official MCP SDK (FastMCP): src/bioconice/mcp.py (issue #100) needs a stdio server
    # and tool/resource decorators that a hand-rolled JSON-RPC loop would just reimplement.
    "mcp>=1.2,<2",
]

[project.scripts]
bioconice = "bioconice.__main__:main"
bioconice-mcp = "bioconice.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]
# ADR-0012: the BugSigDB lander reads cdsci-lake's curated table through the base
# package's `lake_connect`. Its own group so `uv sync --no-group lake` still works
# without the sibling checkout; the lake-path tests importorskip it.
lake = ["cdsci-lake"]

[tool.uv]
default-groups = ["dev", "lake"]

[tool.uv.sources]
# ponytail: path dep until cdsci-lake publishes
cdsci-lake = { path = "../cdsci-lake" }

[tool.pytest.ini_options]
markers = ["slow: hits the live icegate endpoint over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioconice"]
