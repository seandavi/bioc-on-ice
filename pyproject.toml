[project]
name = "bioconice"
version = "0.1.0"
description = "Bioconductor annotation as Iceberg tables"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    # official MCP SDK (FastMCP): src/bioconice/mcp.py (issue #100) needs a stdio server
    # and tool/resource decorators that a hand-rolled JSON-RPC loop would just reimplement.
    "mcp>=1.2,<2",
    # ADR-0013 (bioc) / dataset releases: cdsci.lake builds, verifies, and indexes releases.
    "cdsci-lake",
    # publish.py: DuckDB binds a view by reading its Parquet, so bioconice.duckdb is built
    # with an fsspec filesystem serving the not-yet-uploaded https URLs from the local
    # bundle. Already installed (pyiceberg needs it); declared because we import it.
    "fsspec",
    # hf.py (#214, ADR-0016): the monthly Hugging Face archive is one create_commit + tag,
    # uploaded through Xet (hf-xet comes with it), as omicidx's hf_release does. Same pin.
    "huggingface-hub>=2.2.0",
]

[tool.uv.sources]
cdsci-lake = { git = "https://github.com/seandavi/cdsci-lake", rev = "631ffc9006ace5165d833c2d6390170bac4b7650" }

[project.scripts]
bioconice = "bioconice.__main__:main"
bioconice-mcp = "bioconice.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: hits the live release or icegate over the network; deselected by default, run with -m slow"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioconice"]
